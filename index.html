<!doctype html>
<meta charset="utf-8">
<title>Duddy</title>
<style>
  :root {
    --pop: cubic-bezier(.3, 1.12, .4, 1);
    --out: cubic-bezier(.45, 0, .2, 1);
    --accent: #f0b429; --card: #141418; --pill: #1c1c21; --line: rgba(255,255,255,.07);
    --txt: #f2f2f4; --dim: #8e8e96;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none;
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--txt); }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
  .icon { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* ================= the island: a flat bar glued to the top edge ================= */
  #island { position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 288px; height: 32px; background: #000; border-radius: 0 0 14px 14px; overflow: hidden; contain: layout paint;
    transition: width .36s var(--out), height .36s var(--out), border-radius .36s var(--out); }
  #island.open { width: 640px; border-radius: 0 0 22px 22px;
    transition: width .45s var(--pop), height .45s var(--pop), border-radius .4s var(--pop); }
  #island.open.home, #island.open.settings, #island.open.music, #island.open.approval { height: 196px; }
  #island.open.chat { height: 300px; }
  #island.drop { outline: 2px solid var(--accent); outline-offset: -2px; }

  #dots { position: absolute; right: 16px; top: 0; height: 32px; display: flex; align-items: center; gap: 6px; transition: opacity .15s; }
  .open #dots { opacity: 0; pointer-events: none; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; }
  .busy #dots i { animation: blip .9s ease-in-out infinite; } .busy #dots i:nth-child(2) { animation-delay: .15s; } .busy #dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes blip { 50% { transform: scale(1.5); opacity: .6; } }
  .g { background: #22c55e; } .b { background: #4c8dff; } .o { background: #f59e0b; } .p { background: #a78bfa; } .r { background: #f4506a; } .t { background: #2dd4bf; }

  /* chrome (tabs + views) fades/slides in as the shape moves; no blur = no lag */
  #chrome { position: absolute; inset: 0; opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .12s, transform .15s; }
  .open #chrome { opacity: 1; transform: none; pointer-events: auto; transition: opacity .25s .06s, transform .4s .04s var(--pop); }

  #tabs { position: absolute; top: 0; left: 0; right: 0; height: 42px; display: flex; align-items: center; padding: 0 14px; gap: 4px; }
  .tab { width: 38px; height: 28px; border-radius: 11px; display: grid; place-items: center; color: var(--dim); transition: background .15s, color .15s; }
  .tab:hover { background: rgba(255,255,255,.07); color: var(--txt); }
  .tab.on { background: rgba(255,255,255,.12); color: var(--txt); }
  #tabs .sp { flex: 1; }

  .view { position: absolute; inset: 42px 10px 10px; display: flex; gap: 10px; opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .12s, transform .12s; }
  .home #v-home, .chat #v-chat, .settings #v-settings, .music #v-music, .approval #v-approval { opacity: 1; transform: none; pointer-events: auto; transition: opacity .25s .05s, transform .4s .05s var(--pop); }
  .card { border-radius: 20px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); position: relative; overflow: hidden; }
  .card::after { content: ""; position: absolute; inset: auto 0 0 0; height: 70%; pointer-events: none;
    background: radial-gradient(60% 100% at 50% 100%, rgba(240,180,41,.10), transparent 70%); }

  /* ---- home ---- */
  #hero, #setcard { flex: 1; padding: 0 0 0 148px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  #hero b { font-size: 16px; font-weight: 600; }
  #status { color: var(--dim); font-size: 12px; }
  #stats { margin-top: 6px; font: 11.5px Consolas, "Cascadia Mono", monospace; color: #b8b8c0; }
  #pills { flex: 1.05; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 6px; }
  .pill { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; border-radius: 999px; background: var(--pill);
    box-shadow: inset 0 0 0 1px var(--line); transition: transform .2s var(--pop), background .15s; z-index: 1; }
  .pill:hover { background: #26262d; transform: translateY(-2px); }
  .pill:active { transform: scale(.95); }
  .pill u { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #0c0c0e; text-decoration: none; flex: none; }
  .pill u .icon { width: 14px; height: 14px; stroke-width: 2.3; }

  /* ---- settings ---- */
  #setcard { gap: 5px; padding-right: 22px; }
  .row { display: flex; align-items: center; justify-content: space-between; z-index: 1; }
  .sw { width: 36px; height: 20px; border-radius: 10px; background: #34343b; position: relative; transition: background .2s; flex: none; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .25s var(--pop); }
  .sw.on { background: var(--accent); } .sw.on::after { transform: translateX(16px); }
  .seg { display: flex; background: #26262d; border-radius: 999px; padding: 2px; }
  .seg b { font-weight: 500; font-size: 11.5px; padding: 2px 12px; border-radius: 999px; color: var(--dim); cursor: pointer; }
  .seg b.on { background: var(--accent); color: #1a1405; }
  #keys { color: var(--dim); font-size: 11px; margin-top: 4px; z-index: 1; }

  /* ---- music (iPhone-style now playing) ---- */
  #mcard { flex: 1; display: flex; align-items: center; gap: 16px; padding: 14px 16px; }
  #art { width: 112px; height: 112px; border-radius: 16px; background: linear-gradient(135deg, #2c2c34, #1b1b20); overflow: hidden; flex: none; display: grid; place-items: center;
    color: #55555e; box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 1; transition: transform .3s var(--pop); }
  #art.paused { transform: scale(.9); } #art img { width: 100%; height: 100%; object-fit: cover; }
  #art .icon { width: 38px; height: 38px; }
  #mmeta { flex: 1; min-width: 0; padding-right: 64px; z-index: 1; }
  #mtitle { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #martist { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #prog { position: relative; height: 18px; margin-top: 6px; touch-action: none; }
  #prog::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: #34343b; }
  #prog.seekable { cursor: pointer; }
  #bar { position: absolute; left: 0; top: 7px; height: 4px; width: 0; background: #fff; border-radius: 2px; transition: width 1s linear; }
  #thumb { position: absolute; top: 4px; left: 0; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #fff; transform: scale(0);
    transition: transform .15s var(--pop), left 1s linear; pointer-events: none; }
  #prog.seekable:hover #thumb, #prog.drag #thumb { transform: scale(1); }
  #prog.drag #bar, #prog.drag #thumb { transition: none; }
  #tip { position: absolute; bottom: 17px; left: 0; transform: translateX(-50%); font: 10.5px/1 "Segoe UI", sans-serif; background: #2c2c34; color: #fff; padding: 3px 6px;
    border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .12s; font-variant-numeric: tabular-nums; }
  #prog.seekable:hover #tip, #prog.drag #tip { opacity: 1; }
  #times { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); margin-top: 3px; font-variant-numeric: tabular-nums; }
  #ctl { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 6px; }
  #ctl button { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; transition: transform .2s var(--pop), background .15s; }
  #ctl button:hover { background: rgba(255,255,255,.1); } #ctl button:active { transform: scale(.88); }
  #ctl .icon { width: 20px; height: 20px; fill: currentColor; stroke-width: 1; }
  #m-play { width: 46px !important; height: 46px !important; background: #f4f4f6; color: #0c0c0e; } #m-play:hover { background: #fff !important; }
  #m-play .pause { display: none; } #m-play.on .pause { display: block; } #m-play.on .play { display: none; }

  /* ---- approval (Claude Code asks permission) ---- */
  #acard { flex: 1; padding: 14px 18px 14px 148px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  #acard > * { z-index: 1; }
  #awho { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--accent); }
  #averb { font-size: 16px; font-weight: 600; }
  #adetail { font: 12px/1.45 Consolas, "Cascadia Mono", monospace; background: #0d0d10; border-radius: 10px; padding: 7px 10px; color: #cfcfd6; max-height: 50px;
    overflow: hidden; word-break: break-all; user-select: text; }
  #abtns { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
  #abtns button { padding: 7px 22px; border-radius: 999px; font-weight: 600; transition: transform .2s var(--pop); }
  #abtns button:hover { transform: translateY(-1px); } #abtns button:active { transform: scale(.95); }
  #a-deny { background: #2a2a31; } #a-allow { background: #f4f4f6; color: #0c0c0e; }
  #amore { color: var(--dim); font-size: 11.5px; margin-left: auto; }

  /* ---- chat ---- */
  #v-chat .card { flex: 1; }
  #chat { position: absolute; inset: 0 0 58px 0; padding: 12px 14px 8px 112px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px;
    user-select: text; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .msg { max-width: 90%; padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; animation: pop .3s var(--pop); }
  .msg.bot { background: #212127; border-bottom-left-radius: 5px; align-self: flex-start; }
  .msg.me { background: var(--accent); color: #1a1405; border-bottom-right-radius: 5px; align-self: flex-end; font-weight: 500; }
  .msg.mono { font: 12px/1.5 Consolas, "Cascadia Mono", monospace; max-width: 100%; }
  .msg code, .msg pre { font: 12px Consolas, "Cascadia Mono", monospace; background: rgba(255,255,255,.08); border-radius: 6px; padding: 1px 5px; }
  .msg pre { display: block; padding: 8px 10px; margin: 4px 0; overflow-x: auto; white-space: pre; }
  .typing { display: flex; gap: 4px; padding: 12px 13px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); animation: dot 1s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.94); } }
  @keyframes dot { 0%, 60%, 100% { transform: none; opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }

  #composer { position: absolute; left: 106px; right: 10px; bottom: 10px; z-index: 2; }
  #chips { display: flex; gap: 6px; margin-bottom: 6px; }
  #chips:empty { display: none; }
  .chip { background: #26262d; border-radius: 12px; padding: 2px 10px; font-size: 11.5px; color: var(--dim); cursor: pointer; }
  .chip:hover { color: var(--txt); text-decoration: line-through; }
  #row { display: flex; align-items: center; gap: 4px; height: 40px; background: #26262d; border-radius: 20px; padding: 0 5px 0 6px; transition: box-shadow .2s; }
  #row:focus-within { box-shadow: 0 0 0 1px rgba(240,180,41,.55); }
  #q { flex: 1; background: transparent; border: 0; outline: 0; color: var(--txt); font: inherit; font-size: 13.5px; padding: 0 4px; user-select: text; }
  #q::placeholder { color: var(--dim); }
  .ghost { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--dim); transition: background .15s, color .15s; }
  .ghost:hover { background: rgba(255,255,255,.09); color: var(--txt); }
  #send { background: #f4f4f6; color: #0c0c0e; transition: transform .2s var(--pop); }
  #send:hover { background: #fff; color: #0c0c0e; transform: scale(1.1); }

  /* ================= Duddy the pet: one element that glides between layouts ================= */
  #pet { --body: #d9a82b; --bstroke: #8f6a0e; position: absolute; z-index: 5; left: 14px; top: 5px; width: 40px; pointer-events: none;
    transition: left .45s var(--pop), top .45s var(--pop), width .45s var(--pop); will-change: transform; }
  .open #pet { pointer-events: auto; cursor: pointer; }
  .open.home #pet, .open.settings #pet, .open.approval #pet { left: 34px; top: 87px; width: 116px; animation: breathe 3.6s ease-in-out infinite; }
  .open.music #pet { left: 566px; top: 64px; width: 52px; animation: breathe 3.6s ease-in-out infinite; }
  .open.chat #pet { left: 26px; top: 150px; width: 66px; animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 50% { scale: 1.035; translate: 0 -1px; } }
  #pet.happy { animation: hop .6s var(--pop) 2 !important; }
  @keyframes hop { 40% { translate: 0 -7px; scale: 1.08; } }
  #pet.annoyed { animation: shake .12s linear 4 !important; }
  @keyframes shake { 25% { translate: -2px 0; } 75% { translate: 2px 0; } }
  #pet.dizzy { animation: sway .45s ease-in-out infinite alternate !important; }
  @keyframes sway { from { rotate: -7deg; } to { rotate: 7deg; } }
  #pet svg { display: block; width: 100%; overflow: visible; }

  .housing { fill: var(--body); stroke: var(--bstroke); stroke-width: 2; }
  .lens { fill: #0c1016; }
  .pupil-w { transform: translate(calc(var(--px, 0) * 7px), calc(var(--py, 0) * 6px)); transition: transform .15s ease-out; }
  .pupil { fill: #9bf0ff; filter: drop-shadow(0 0 3px #4fd8f5); transform-box: fill-box; transform-origin: center; transition: transform .25s var(--pop), fill .2s; }
  .glint { fill: #fff; opacity: .85; }
  .lid { fill: var(--body); transition: transform .16s ease-out; transform: translateY(-40px); }
  .lid.l { transform-origin: 34px 28px; } .lid.r { transform-origin: 86px 28px; }
  .think .lid { transform: translateY(-23px); }
  .sad .lid.l { transform: rotate(-22deg) translateY(-21px); } .sad .lid.r { transform: rotate(22deg) translateY(-21px); }
  .annoyed .lid.l { transform: rotate(24deg) translateY(-19px); } .annoyed .lid.r { transform: rotate(-24deg) translateY(-19px); }
  .happy .pupil { transform: scale(1.3); }
  .love .pupil { fill: #ff7aa8; transform: scale(1.35); filter: drop-shadow(0 0 3px #ff4f8b); }
  .blink .lid { transform: translateY(0) !important; }
  .think .pupil-w { animation: scan 1.1s ease-in-out infinite alternate; }
  .dizzy .pupil-w { animation: spin .5s linear infinite; }
  @keyframes scan { from { transform: translate(-7px, 0); } to { transform: translate(7px, 0); } }
  @keyframes spin { 0% { transform: translate(6px, 0); } 25% { transform: translate(0, 5px); } 50% { transform: translate(-6px, 0); } 75% { transform: translate(0, -5px); } 100% { transform: translate(6px, 0); } }
  #hat { display: none; } .open #hat { display: block; }

  .heart { position: absolute; z-index: 6; color: #ff7aa8; font-size: 14px; pointer-events: none; animation: rise 1.3s ease-out forwards; }
  @keyframes rise { from { opacity: 1; transform: translateY(0) scale(.6); } to { opacity: 0; transform: translateY(-34px) scale(1.2); } }

  #wardrobe { position: absolute; z-index: 9; left: 160px; top: 96px; display: none; background: #1d1d22; border-radius: 16px; padding: 10px 12px;
    box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.6); }
  #wardrobe.show { display: block; animation: pop .25s var(--pop); }
  #wardrobe div { display: flex; gap: 8px; align-items: center; } #wardrobe div + div { margin-top: 9px; }
  .sw2 { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.15); }
  .sw2.on { box-shadow: 0 0 0 2px var(--accent); }
  #wardrobe .hatb { font-size: 11.5px; padding: 3px 9px; border-radius: 10px; background: #2a2a31; color: var(--dim); }
  #wardrobe .hatb.on { background: var(--accent); color: #1a1405; }
</style>

<div id="island" class="home">
  <div id="pet">
    <svg viewBox="0 0 120 56">
      <defs>
        <clipPath id="cl"><circle cx="34" cy="28" r="18"/></clipPath>
        <clipPath id="cr"><circle cx="86" cy="28" r="18"/></clipPath>
      </defs>
      <g id="hat"></g>
      <circle class="housing" cx="34" cy="28" r="24"/><circle class="housing" cx="86" cy="28" r="24"/>
      <circle class="lens" cx="34" cy="28" r="18"/><circle class="lens" cx="86" cy="28" r="18"/>
      <g class="pupil-w"><circle class="pupil" cx="34" cy="28" r="7"/><circle class="glint" cx="31" cy="25" r="2"/></g>
      <g class="pupil-w"><circle class="pupil" cx="86" cy="28" r="7"/><circle class="glint" cx="83" cy="25" r="2"/></g>
      <g clip-path="url(#cl)"><rect class="lid l" x="14" y="10" width="40" height="36"/></g>
      <g clip-path="url(#cr)"><rect class="lid r" x="66" y="10" width="40" height="36"/></g>
    </svg>
  </div>

  <div id="dots"><i class="g"></i><i class="b"></i><i class="o"></i></div>

  <div id="wardrobe">
    <div id="swatches"></div>
    <div id="hats"><button class="hatb" data-hat="">No hat</button><button class="hatb" data-hat="party">Party</button><button class="hatb" data-hat="crown">Crown</button></div>
  </div>

  <div id="chrome">
    <div id="tabs">
      <button class="tab on" id="t-home" title="Home"><svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
      <button class="tab" id="t-chat" title="Chat"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg></button>
      <button class="tab" id="t-music" title="Music"><svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
      <button class="tab" id="t-new" title="New chat"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <span class="sp"></span>
      <button class="tab" id="t-set" title="Settings"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
      <button class="tab" id="quit" title="Quit Duddy"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div class="view" id="v-home">
      <div class="card" id="hero"><b>Duddy</b><span id="status">Ready</span><span id="stats">…</span></div>
      <div class="card" id="pills">
        <button class="pill" id="b-health"><u class="g"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></u>Health</button>
        <button class="pill" id="b-disk"><u class="b"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M5 13l2-8h10l2 8"/></svg></u>Disks</button>
        <button class="pill" id="b-proc"><u class="t"><svg class="icon" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg></u>Processes</button>
        <button class="pill" id="b-clean"><u class="r"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></u>Clean</button>
        <button class="pill" id="b-term"><u class="o"><svg class="icon" viewBox="0 0 24 24"><path d="M5 7l5 5-5 5M13 18h6"/></svg></u>Terminal</button>
        <button class="pill" id="b-ask"><u class="p"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg></u>Ask</button>
      </div>
    </div>

    <div class="view" id="v-chat">
      <div class="card">
        <div id="chat"><div class="msg bot">Hi, I'm Duddy. Ask me anything or drop a file here.</div></div>
        <div id="composer">
          <div id="chips"></div>
          <div id="row">
            <button class="ghost" id="attach" title="Attach files"><svg class="icon" viewBox="0 0 24 24"><path d="M21 11l-8.5 8.5a5 5 0 01-7-7L14 4a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 7"/></svg></button>
            <input id="q" placeholder="Ask Duddy…" autocomplete="off">
            <button class="ghost" id="send" title="Send"><svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <div class="view" id="v-approval">
      <div class="card" id="acard">
        <span id="awho">Claude Code</span><span id="averb"></span><div id="adetail"></div>
        <div id="abtns"><button id="a-deny">Deny</button><button id="a-allow">Allow</button><span id="amore"></span></div>
      </div>
    </div>

    <div class="view" id="v-music">
      <div class="card" id="mcard">
        <div id="art"><svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></div>
        <div id="mmeta">
          <div id="mtitle">Nothing playing</div><div id="martist">Start Spotify and press play</div>
          <div id="prog"><i id="bar"></i><i id="thumb"></i><b id="tip"></b></div><div id="times"><span id="tpos">0:00</span><span id="tdur">0:00</span></div>
          <div id="ctl">
            <button id="m-prev" title="Previous"><svg class="icon" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
            <button id="m-play" title="Play / pause"><svg class="icon play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="icon pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
            <button id="m-next" title="Next"><svg class="icon" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <div class="view" id="v-settings">
      <div class="card" id="setcard">
        <div class="row">Brain <span class="seg"><b id="p-gem">Gemini · free</b><b id="p-cla">Claude · Pro</b></span></div>
        <div class="row" title="Show Claude Code permission requests here">Claude Code alerts <span class="sw" id="s-hooks"></span></div>
        <div class="row">Open on hover <span class="sw" id="s-hover"></span></div>
        <div class="row">Sounds <span class="sw" id="s-sound"></span></div>
        <div class="row">Launch at login <span class="sw" id="s-login"></span></div>
      </div>
    </div>
    <input id="pick" type="file" multiple hidden>
  </div>
</div>

<script>
// outside Electron (plain browser preview) fall back to a stub
const bridge = window.api || { onPerm() {}, onPermGone() {}, onNote() {}, decide() {}, hooksStatus: async () => false, hooksToggle: async () => ({ on: true }), shape() {}, terminal() {}, quit() {}, setLogin() {}, onChunk() {}, onCmd() {}, getLogin: async () => false,
  ask: async () => 'Preview **mode** reply with `code`.', health: async () => 'CPU 7%  RAM 8.1 GB / 16 GB', disks: async () => 'C: 210 GB used / 476 GB',
  procs: async () => 'chrome  812 MB', media: async (a) => (a === 'art' ? {} : { title: 'Italiana', artist: 'Severina', app: 'Spotify', playing: true, seek: true, pos: 40, dur: 250 }), clean: async () => 'Temp folder is already clean.', stats: async () => ({ cpu: 7, ram: 52 }) };
const $ = (id) => document.getElementById(id);
const island = $('island'), pet = $('pet'), chat = $('chat'), q = $('q'), status = $('status'), svg = pet.firstElementChild;
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem('duddy.' + k)) ?? d; } catch { return d; } },
                set: (k, v) => { try { localStorage.setItem('duddy.' + k, JSON.stringify(v)); } catch {} } };
const cfg = { brain: store.get('brain', 'gemini'), hover: store.get('hover', true), sound: store.get('sound', true), body: store.get('body', 0), hat: store.get('hat', '') };
let files = [], busy = false, hovering = false, closeT, shrinkT, statsT, idleT, lastMove = Date.now();

/* ---- tiny synthesized sounds (no audio files) ---- */
let ac;
function snd(name) {
  if (!cfg.sound) return;
  const seq = { open: [[520, .07], [780, .09]], done: [[660, .08], [880, .08], [1100, .12]], err: [[240, .16]], poke: [[900, .05], [700, .07]], love: [[880, .08], [1180, .12]], dizzy: [[400, .1], [300, .1], [400, .1]] }[name];
  try {
    ac = ac || new AudioContext(); let t = ac.currentTime;
    for (const [f, d] of seq) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.04, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d); t += d * .85;
    }
  } catch {}
}

/* ---- views ---- */
let current = 'home';
function view(v) {
  current = v;
  for (const n of ['home', 'chat', 'settings', 'music', 'approval']) island.classList.toggle(n, v === n);
  $('t-home').classList.toggle('on', v === 'home'); $('t-chat').classList.toggle('on', v === 'chat'); $('t-set').classList.toggle('on', v === 'settings'); $('t-music').classList.toggle('on', v === 'music'); syncMedia();
  if (v === 'chat') setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 60);
}
$('t-home').onclick = () => view('home');
$('t-chat').onclick = () => view('chat');
$('t-set').onclick = () => view('settings');
$('t-music').onclick = () => view('music');
$('t-new').onclick = () => { bridge.ask('/new', [], cfg.brain); chat.replaceChildren(); add('bot', 'New chat. What\'s up?'); view('chat'); q.focus(); };
$('b-ask').onclick = () => { view('chat'); q.focus(); };
$('quit').onclick = () => bridge.quit();

/* ---- open / close: the window never resizes, only the visible shape does ---- */
const OPEN = [644, 310], CLOSED = [296, 36];
function open() {
  if (island.classList.contains('open')) return;
  clearTimeout(shrinkT); bridge.shape(...OPEN); island.classList.add('open');
  snd('open'); mood('happy', 1300); refreshStats();
  statsT = setInterval(refreshStats, 3000); idleT = setInterval(wander, 2200); syncMedia();
}
function close() {
  clearInterval(statsT); clearInterval(idleT); island.classList.remove('open'); syncMedia(); $('wardrobe').classList.remove('show');
  clearTimeout(shrinkT); shrinkT = setTimeout(() => { if (!island.classList.contains('open')) bridge.shape(...CLOSED); }, 600);
}
const tryClose = () => { if (!hovering && !busy && !perms.length && document.activeElement !== q) close(); };
island.onmouseenter = () => { hovering = true; clearTimeout(closeT); if (cfg.hover) open(); };
island.onmouseleave = () => { hovering = false; closeT = setTimeout(tryClose, 450); };
island.onclick = () => open(); // with "Open on hover" off, click the bar
q.onblur = () => { closeT = setTimeout(tryClose, 450); };
q.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { q.blur(); hovering = false; close(); } });
bridge.onCmd((c) => {
  if (c === 'chat') { open(); view('chat'); setTimeout(() => q.focus(), 250); }
  else if (island.classList.contains('open')) { hovering = false; close(); }
  else { open(); closeT = setTimeout(tryClose, 5000); }
});

async function refreshStats() { const s = await bridge.stats(); $('stats').textContent = `CPU ${s.cpu}%  ·  RAM ${s.ram}%`; }

/* ---- Duddy: moods, eyes, blinking, poking, wardrobe ---- */
const MOODS = ['happy', 'sad', 'think', 'annoyed', 'dizzy', 'love']; let moodT;
function mood(name, ms) {
  clearTimeout(moodT);
  for (const el of [pet, svg]) { el.classList.remove(...MOODS); if (name) el.classList.add(name); }
  if (ms) moodT = setTimeout(() => mood(busy ? 'think' : null), ms);
}
let ticking = false, mx = 0, my = 0;
document.addEventListener('mousemove', (e) => {
  lastMove = Date.now(); mx = e.clientX; my = e.clientY;
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => { // at most one layout read per frame
    ticking = false; const r = pet.getBoundingClientRect(), k = (v) => Math.max(-1, Math.min(1, v / 160));
    look(k(mx - (r.left + r.width / 2)), k(my - (r.top + r.height / 2)));
  });
});
const look = (x, y) => { pet.style.setProperty('--px', x); pet.style.setProperty('--py', y); };
const wander = () => { if (Date.now() - lastMove > 3000 && !busy) look(Math.random() * 2 - 1, Math.random() * 1.2 - .6); };
(function blink() {
  svg.classList.add('blink'); setTimeout(() => svg.classList.remove('blink'), 140);
  setTimeout(blink, 2500 + Math.random() * 3500);
})();

let pokes = [], loveT;
pet.onclick = () => {
  const now = Date.now(); pokes = pokes.filter((t) => now - t < 1500); pokes.push(now);
  if (pokes.length >= 3) { pokes = []; mood('dizzy', 2200); snd('dizzy'); } else { mood('annoyed', 700); snd('poke'); }
};
pet.onmouseenter = () => { loveT = setTimeout(() => { mood('love', 2500); snd('love'); for (let i = 0; i < 5; i++) setTimeout(heart, i * 160); }, 2000); };
pet.onmouseleave = () => clearTimeout(loveT);
function heart() {
  const h = document.createElement('span'); h.className = 'heart'; h.textContent = '♥';
  const r = pet.getBoundingClientRect(), b = island.getBoundingClientRect();
  h.style.left = (r.left - b.left + 10 + Math.random() * (r.width - 20)) + 'px'; h.style.top = (r.top - b.top - 4) + 'px';
  island.appendChild(h); setTimeout(() => h.remove(), 1400);
}

const BODIES = [['#d9a82b', '#8f6a0e'], ['#5ac8a0', '#2d7a5f'], ['#e8799b', '#9a3d5c'], ['#5aa9e8', '#2b5f93'], ['#9096a3', '#4a4e56']];
const HATS = {
  party: '<polygon points="46,5 74,5 60,-26" fill="#e8523f"/><path d="M52,-8L68,-8" stroke="#fff" stroke-width="3"/><circle cx="60" cy="-27" r="4" fill="#fff"/>',
  crown: '<path d="M44,6L44,-12L52,-4L60,-16L68,-4L76,-12L76,6Z" fill="#ffd34d" stroke="#b8860b" stroke-width="2"/>',
};
function dress() {
  const [c, s] = BODIES[cfg.body]; pet.style.setProperty('--body', c); pet.style.setProperty('--bstroke', s);
  $('hat').innerHTML = HATS[cfg.hat] || '';
  [...$('swatches').children].forEach((b, i) => b.classList.toggle('on', i === cfg.body));
  [...$('hats').children].forEach((b) => b.classList.toggle('on', b.dataset.hat === cfg.hat));
}
$('swatches').replaceChildren(...BODIES.map(([c], i) => { const b = document.createElement('button'); b.className = 'sw2'; b.style.background = c; b.onclick = () => { cfg.body = i; store.set('body', i); dress(); snd('love'); }; return b; }));
$('hats').onclick = (e) => { if (e.target.dataset.hat === undefined) return; cfg.hat = e.target.dataset.hat; store.set('hat', cfg.hat); dress(); snd('love'); };
pet.oncontextmenu = (e) => { e.preventDefault(); $('wardrobe').classList.toggle('show'); };
document.addEventListener('click', (e) => { if (!e.target.closest('#wardrobe') && !e.target.closest('#pet')) $('wardrobe').classList.remove('show'); });
dress();

/* ---- Claude Code permission requests (via hooks): always a human click, never automatic ---- */
const perms = []; let backTo = 'home';
function showPerm() {
  if (!perms.length) { view(backTo); mood(null); if (!hovering) closeT = setTimeout(tryClose, 1500); return; }
  const p = perms[0];
  $('awho').textContent = 'Claude Code' + (p.project ? ' · ' + p.project : '');
  $('averb').textContent = p.verb; $('adetail').textContent = p.detail;
  $('amore').textContent = perms.length > 1 ? '+' + (perms.length - 1) + ' waiting' : '';
  if (current !== 'approval') backTo = current;
  open(); view('approval'); mood('sad');
}
bridge.onPerm((p) => { perms.push(p); if (perms.length === 1) snd('err'); showPerm(); });
bridge.onPermGone((id) => { const i = perms.findIndex((p) => p.id === id); if (i >= 0) { perms.splice(i, 1); showPerm(); } });
function decide(d) { const p = perms.shift(); if (!p) return; bridge.decide(p.id, d); snd(d === 'allow' ? 'done' : 'poke'); showPerm(); if (!perms.length) mood(d === 'allow' ? 'happy' : null, 1200); }
$('a-allow').onclick = () => decide('allow'); $('a-deny').onclick = () => decide('deny');
bridge.onNote((n) => { // Claude finished / needs you: a short peek, then back to sleep
  const proj = n.cwd ? n.cwd.split(/[\\/]/).pop() : '';
  status.textContent = n.kind === 'stop' ? 'Claude finished' + (proj ? ' in ' + proj : '') : n.kind === 'ask' ? 'Claude has a question: check the terminal' : n.text;
  if (perms.length) return;
  view('home'); open(); mood('happy', 1500); snd(n.kind === 'stop' ? 'done' : 'open');
  if (!hovering) closeT = setTimeout(tryClose, 3500);
});

/* ---- music: polls only while the Music tab is visible, ticks the progress bar locally in between ---- */
let mi = null, mkey = '', mtick = 0, mTimer, scrub = null; // scrub = seconds while dragging the bar
const fmt = (n) => Math.floor(n / 60) + ':' + String(Math.floor(n % 60)).padStart(2, '0');
function paintMedia() {
  const on = mi && mi.title;
  $('mtitle').textContent = on ? mi.title : 'Nothing playing';
  $('martist').textContent = on ? (mi.artist || (/spotify/i.test(mi.app) ? 'Spotify' : mi.app)) : 'Start Spotify and press play';
  const pos = scrub !== null ? scrub : on ? Math.min(mi.dur || 0, mi.pos + (mi.playing ? (Date.now() - mi.at) / 1000 : 0)) : 0;
  const pct = on && mi.dur ? (100 * pos / mi.dur) + '%' : '0';
  $('bar').style.width = pct; $('thumb').style.left = pct; $('prog').classList.toggle('seekable', !!(on && mi.seek && mi.dur));
  $('tpos').textContent = fmt(pos); $('tdur').textContent = fmt(on ? mi.dur : 0);
  $('m-play').classList.toggle('on', !!(on && mi.playing)); $('art').classList.toggle('paused', !(on && mi.playing));
}
function applyMedia(r) {
  mi = r.none || !r.title ? null : { ...r, at: Date.now() };
  const key = mi ? mi.title + mi.artist : '';
  if (key !== mkey) {
    mkey = key; $('art').querySelector('img')?.remove(); $('art').firstElementChild.style.display = '';
    if (mi) bridge.media('art').then((a) => {
      if (!a.data || key !== mkey) return;
      const im = new Image(); im.src = 'data:' + a.mime + ';base64,' + a.data;
      $('art').firstElementChild.style.display = 'none'; $('art').append(im);
    });
  }
  paintMedia();
}
const pollMedia = async () => applyMedia(await bridge.media('info'));
function syncMedia() {
  clearInterval(mTimer);
  if (!(island.classList.contains('open') && current === 'music')) return;
  mtick = 0; pollMedia(); mTimer = setInterval(() => { paintMedia(); if (++mtick % 3 === 0) pollMedia(); }, 1000);
}
async function mediaCmd(a) { // flip the UI first so it feels instant, then take the real state
  if (a === 'play' && mi) { mi.playing = !mi.playing; mi.at = Date.now(); paintMedia(); }
  applyMedia(await bridge.media(a)); snd('poke');
}
// click or drag the bar to jump anywhere in the track (works with Spotify, YouTube and any player that allows seeking)
const prog = $('prog'), at = (e) => { const r = prog.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (mi?.dur || 0); };
const canSeek = () => mi && mi.seek && mi.dur;
prog.onpointerdown = (e) => { if (!canSeek()) return; prog.setPointerCapture(e.pointerId); prog.classList.add('drag'); scrub = at(e); paintMedia(); };
prog.onpointermove = (e) => {
  if (!canSeek()) return;
  const s = at(e); $('tip').textContent = fmt(s); $('tip').style.left = e.clientX - prog.getBoundingClientRect().left + 'px';
  if (scrub !== null) { scrub = s; paintMedia(); }
};
prog.onpointerup = async () => {
  if (scrub === null) return;
  const s = Math.round(scrub); scrub = null; prog.classList.remove('drag');
  mi.pos = s; mi.at = Date.now(); paintMedia(); // jump the UI first, then confirm with the player
  const r = await bridge.media('seek:' + s); applyMedia(r.none ? r : { ...r, pos: s }); snd('poke');
};
$('m-play').onclick = () => mediaCmd('play'); $('m-next').onclick = () => mediaCmd('next'); $('m-prev').onclick = () => mediaCmd('prev');

/* ---- settings ---- */
function toggles() {
  $('p-gem').classList.toggle('on', cfg.brain === 'gemini'); $('p-cla').classList.toggle('on', cfg.brain === 'claude');
  $('s-hover').classList.toggle('on', cfg.hover); $('s-sound').classList.toggle('on', cfg.sound);
}
$('p-gem').onclick = () => { cfg.brain = 'gemini'; store.set('brain', 'gemini'); toggles(); bridge.ask('/new', [], 'gemini'); };
$('p-cla').onclick = () => { cfg.brain = 'claude'; store.set('brain', 'claude'); toggles(); bridge.ask('/new', [], 'claude'); };
$('s-hover').onclick = () => { cfg.hover = !cfg.hover; store.set('hover', cfg.hover); toggles(); };
$('s-sound').onclick = () => { cfg.sound = !cfg.sound; store.set('sound', cfg.sound); toggles(); snd('love'); };
$('s-login').onclick = () => { const on = !$('s-login').classList.contains('on'); $('s-login').classList.toggle('on', on); bridge.setLogin(on); };
bridge.getLogin().then((on) => $('s-login').classList.toggle('on', on));
bridge.hooksStatus().then((on) => $('s-hooks').classList.toggle('on', on));
$('s-hooks').onclick = async () => {
  const r = await bridge.hooksToggle(); $('s-hooks').classList.toggle('on', r.on);
  if (r.error) { status.textContent = 'Error: ' + r.error; mood('sad', 2500); }
};
toggles();

/* ---- chat (streamed, light markdown) ---- */
function md(el, text) {
  el.replaceChildren(...text.split(/(```[\s\S]*?(?:```|$))/g).flatMap((blk) => {
    if (blk.startsWith('```')) { const p = document.createElement('pre'); p.textContent = blk.replace(/^```\w*\n?/, '').replace(/```$/, ''); return [p]; }
    return blk.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/g).map((s) => {
      const tag = /^`[^`]+`$/.test(s) ? 'code' : /^\*\*.+\*\*$/.test(s) ? 'b' : null;
      if (!tag) return document.createTextNode(s);
      const n = document.createElement(tag); n.textContent = s.slice(tag === 'code' ? 1 : 2, tag === 'code' ? -1 : -2); return n;
    });
  }));
}
function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  if (text) md(d, text);
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
let live = null; // the bubble currently being streamed into
bridge.onChunk((t) => {
  if (!live) return;
  if (!live.bub) { live.typing.remove(); live.bub = add('bot', ''); }
  live.acc += t; md(live.bub, live.acc); chat.scrollTop = chat.scrollHeight;
});
async function run(userText, fn, cls = 'bot') {
  view('chat'); busy = true; mood('think'); status.textContent = 'Thinking…'; island.classList.add('busy');
  if (userText) add('me', userText);
  const typing = add('bot typing', ''); typing.innerHTML = '<i></i><i></i><i></i>';
  live = { typing, bub: null, acc: '' };
  const out = await fn(); const l = live; live = null;
  if (l.bub) md(l.bub, out); else { typing.remove(); add(cls, out); }
  busy = false; island.classList.remove('busy');
  const bad = out.startsWith('Error:');
  status.textContent = bad ? 'Something went wrong' : 'Ready';
  mood(bad ? 'sad' : 'happy', bad ? 2500 : 1300); snd(bad ? 'err' : 'done');
  if (!hovering) closeT = setTimeout(tryClose, 2500);
}
function submit() {
  const text = q.value.trim(); if (!text) return;
  const f = files; q.value = ''; files = []; renderChips();
  run(text + (f.length ? `\n📎 ${f.map((x) => x.name).join(', ')}` : ''), () => bridge.ask(text, f, cfg.brain));
}
$('send').onclick = submit;
$('b-health').onclick = () => run('Health check', bridge.health, 'bot mono');
$('b-disk').onclick = () => run('Disk usage', bridge.disks, 'bot mono');
$('b-proc').onclick = () => run('Top processes', bridge.procs, 'bot mono');
$('b-clean').onclick = () => run('Clean temp files', bridge.clean);
$('b-term').onclick = () => { bridge.terminal(); status.textContent = 'Opened PowerShell'; mood('happy', 1000); snd('done'); };

/* ---- files ---- */
function renderChips() {
  $('chips').replaceChildren(...files.map((f, i) => {
    const c = document.createElement('span'); c.className = 'chip'; c.textContent = '📎 ' + f.name; c.title = 'Click to remove';
    c.onclick = () => { files.splice(i, 1); renderChips(); }; return c;
  }));
}
async function addFiles(list) {
  for (const f of list) {
    const data = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(f); });
    files.push({ name: f.name, type: f.type || 'text/plain', data });
  }
  renderChips(); view('chat'); mood('happy', 900);
}
$('attach').onclick = () => $('pick').click();
$('pick').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
island.ondragover = (e) => { e.preventDefault(); open(); island.classList.add('drop'); };
island.ondragleave = () => island.classList.remove('drop');
island.ondrop = (e) => { e.preventDefault(); island.classList.remove('drop'); addFiles(e.dataTransfer.files); };
</script>
